[workspace]
members = [
    "crates/kicad-parser", "crates/model-api",
    "crates/occt-sys",
    "crates/opencascade",
    "crates/opencascade-sys",
    "crates/viewer", "crates/wasm-example",
    "examples",
]

resolver = "2"

# OCCT is always compiled in Release mode by `occt-sys` because its static
# libraries are linked into the final binaries regardless of the Rust profile.
